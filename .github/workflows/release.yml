name: release

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: Tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-slim
    env:
      HAS_AMO_CREDENTIALS: ${{ secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != '' }}
    steps:
      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_call" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Check out tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.meta.outputs.tag }}
          fetch-depth: 0

      - name: Create release zips
        shell: bash
        run: python scripts/build_packages.py "${{ steps.meta.outputs.tag }}"

      - name: Create GitHub Release and upload zips
        uses: actions/github-script@v8
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          ASSET_NAMES: Better-TID-tools.zip Better-TID-tools-firefox.zip
        with:
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag_name = process.env.TAG;
            const assetNames = process.env.ASSET_NAMES.split(" ");

            let release;
            try {
              release = (
                await github.rest.repos.getReleaseByTag({
                  owner,
                  repo,
                  tag: tag_name,
                })
              ).data;
            } catch (error) {
              if (error.status !== 404) throw error;

              release = (
                await github.rest.repos.createRelease({
                  owner,
                  repo,
                  tag_name,
                  name: tag_name,
                  generate_release_notes: true,
                })
              ).data;
            }

            for (const asset of release.assets) {
              if (assetNames.includes(asset.name)) {
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: asset.id,
                });
              }
            }

            for (const assetName of assetNames) {
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name: assetName,
                data: fs.readFileSync(assetName),
              });
            }

      # AMO（addons.mozilla.org）へ listed で提出する。審査は非同期なので承認は待たない。
      # AMO_JWT_ISSUER / AMO_JWT_SECRET が未設定なら提出をスキップする。
      - name: Set up Node.js for web-ext
        if: env.HAS_AMO_CREDENTIALS == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Submit Firefox package to AMO
        if: env.HAS_AMO_CREDENTIALS == 'true'
        shell: bash
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          mkdir -p firefox-src
          python -m zipfile -e Better-TID-tools-firefox.zip firefox-src
          npx --yes web-ext@8.10.0 sign \
            --source-dir firefox-src \
            --artifacts-dir web-ext-artifacts \
            --channel listed \
            --amo-metadata .github/amo-metadata.json \
            --approval-timeout 0
